<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16803c">
  <title>Juego por la Educación Pública</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --green: #16803c; --green-dark: #0f6330; --green-light: #e8f5ec;
      --ink: #202820; --muted: #657168;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; font-family: Arial, Helvetica, sans-serif; color: var(--ink); }
    body { overflow: hidden; }

    /* Bienvenida */
    #welcome {
      position: fixed; inset: 0; z-index: 3000; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px; padding: 28px 20px;
      overflow-y: auto; background: var(--green); color: #fff; text-align: center;
    }
    #welcome h1 { max-width: 1000px; margin: 0; font-size: clamp(2.5rem, 10vw, 7rem); line-height: 1.04; }
    #welcome p { max-width: 850px; margin: 0; font-size: clamp(2rem, 6vw, 3.1rem); line-height: 1.4; }
    #welcomeDolls { display: flex; align-items: end; justify-content: center; gap: clamp(10px, 4vw, 42px); }
    #welcomeDolls .doll-wrap { width: clamp(90px, 20vw, 170px); height: clamp(125px, 28vw, 235px); }
    #startButton {
      border: 3px solid #fff; border-radius: 999px; padding: 18px 48px;
      background: #fff; color: var(--green-dark); font-size: 2.24rem; font-weight: 700;
      cursor: pointer; min-width: 210px;
    }
    button:focus-visible, input:focus-visible { outline: 4px solid #f2c94c; outline-offset: 3px; }

    /* Mapa */
    #game { display: none; position: fixed; inset: 0; }
    #map { position: absolute; inset: 0; width: 100%; height: 100%; }
    .map-header {
      position: absolute; z-index: 700; top: 14px; left: 50%; transform: translateX(-50%);
      width: min(60vw, 680px); padding: 15px 18px; border-radius: 16px;
      background: rgba(255,255,255,.97); box-shadow: 0 2px 14px #0002; text-align: center;
    }
    .map-header strong { display: block; font-size: 1.96rem; line-height: 1.15; }
    #progress { margin-top: 8px; color: var(--muted); font-size: 1.76rem; line-height: 1.2; }
    #gpsStatus { margin-top: 8px; color: var(--muted); font-size: 1.56rem; line-height: 1.25; }

    /* Tres muñecos fijos en las esquinas */
    .doll-card {
      position: absolute; z-index: 750; width: 142px; padding: 7px 7px 8px;
      border-radius: 15px; background: rgba(255,255,255,.97);
      box-shadow: 0 2px 14px #0003; text-align: center; pointer-events: none;
    }
    #dollCardPurple { top: 12px; left: 12px; }
    #dollCardOrange { top: 12px; right: 12px; }
    #dollCardRed { bottom: 12px; left: 12px; }
    .doll-card .doll-wrap { width: 124px; height: 166px; margin: 0 auto; }
    .doll-caption { font-size: 1.44rem; line-height: 1.1; font-weight: 700; }
    .doll-purple { --doll-color: #8b55c7; }
    .doll-orange { --doll-color: #ed8b25; }
    .doll-red { --doll-color: #d94343; }

    /* Muñeco y prendas */
    .doll-svg { width: 100%; height: 100%; overflow: visible; }
    .clothing { display: none; }
    .doll-svg.level-1 #shirt { display: inline; }
    .doll-svg.level-2 #shirt, .doll-svg.level-2 #pants { display: inline; }
    .doll-svg.level-3 #shirt, .doll-svg.level-3 #pants, .doll-svg.level-3 #socks { display: inline; }
    .doll-svg.level-4 #shirt, .doll-svg.level-4 #pants, .doll-svg.level-4 #socks, .doll-svg.level-4 #hat { display: inline; }
    .doll-svg.level-5 #shirt, .doll-svg.level-5 #pants, .doll-svg.level-5 #socks, .doll-svg.level-5 #hat, .doll-svg.level-5 #shoes { display: inline; }
    .doll-svg.level-6 #shirt, .doll-svg.level-6 #pants, .doll-svg.level-6 #socks, .doll-svg.level-6 #hat, .doll-svg.level-6 #shoes, .doll-svg.level-6 #hoodie { display: inline; }
    .doll-svg.level-7 #shirt, .doll-svg.level-7 #pants, .doll-svg.level-7 #socks, .doll-svg.level-7 #hat, .doll-svg.level-7 #shoes, .doll-svg.level-7 #hoodie, .doll-svg.level-7 #gloves { display: inline; }
    .doll-svg.level-8 .clothing { display: inline; }

    /* Marcadores por zonas */
    .zone-marker {
      width: 30px; height: 30px; border-radius: 50%; border: 4px solid currentColor;
      box-shadow: 0 1px 6px #0006; background: currentColor;
    }
    .zone-marker.purple { color: #8b55c7; }
    .zone-marker.orange { color: #ed8b25; }
    .zone-marker.red { color: #d94343; }
    .zone-marker.done { color: #22a447; border-color: #116b2d; background: #22a447; }
    .player-dot {
      width: 24px; height: 24px; border-radius: 50%; background: rgba(0, 105, 255, .5);
      border: 2px solid rgba(0, 76, 190, .85); box-shadow: 0 0 0 5px rgba(0, 105, 255, .12);
    }

    /* Preguntas y pantallas */
    .overlay {
      position: fixed; inset: 0; z-index: 2000; display: none; align-items: center;
      justify-content: center; padding: 22px; background: rgba(12, 25, 16, .72);
    }
    .dialog {
      width: min(100%, 760px); max-height: 90vh; overflow-y: auto; background: #fff;
      border-radius: 18px; padding: clamp(26px, 6vw, 48px); box-shadow: 0 10px 40px #0004;
    }
    .dialog h2 { margin: 0 0 18px; color: var(--green-dark); font-size: clamp(2.8rem, 8vw, 4rem); }
    .dialog p { font-size: 1.8rem; line-height: 1.5; }
    .dialog .question { font-size: 2.32rem; font-weight: 700; }
    .dialog label { font-size: 1.8rem; font-weight: 700; }
    .dialog input {
      width: 100%; padding: 18px 18px; margin: 12px 0 18px; border: 2px solid #b9c4bb;
      border-radius: 10px; font-size: 2.1rem;
    }
    .primary-button {
      border: 0; border-radius: 999px; padding: 18px 30px; background: var(--green);
      color: white; font-size: 2rem; font-weight: 700; cursor: pointer;
    }
    .primary-button:disabled { opacity: .55; cursor: wait; }
    .feedback { min-height: 1.35em; margin: 10px 0 0; color: #9a2d22; font-size: 1.8rem !important; }
    #successOverlay { z-index: 2500; background: #fff; color: var(--ink); overflow-y: auto; }
    #successContent { width: min(100%, 900px); max-height: 100%; overflow-y: auto; padding: 34px 26px; text-align: left; }
    #successTitle { margin: 0 0 24px; color: var(--green); text-align: center; font-size: clamp(4rem, 12vw, 6.4rem); }
    #successText { font-size: clamp(1.96rem, 5vw, 2.2rem); line-height: 1.55; }
    #successText h3 { color: var(--green-dark); font-size: 2.7rem; margin: 0 0 20px; }
    #successText p { margin: 0 0 18px; }
    #successText strong { font-weight: 700; }
    #continueButton { display: block; margin: 28px auto 0; min-width: 190px; }

    @media (max-width: 650px) {
      .map-header {
        top: auto; bottom: 12px; width: min(58vw, 380px); left: auto; right: 10px;
        transform: none; padding: 10px 12px;
      }
      .map-header strong { font-size: 1.96rem; }
      #progress { font-size: 1.76rem; }
      #gpsStatus { font-size: 1.56rem; }
      .doll-card { width: 100px; padding: 5px; }
      #dollCardPurple { top: 8px; left: 8px; }
      #dollCardOrange { top: 8px; right: 8px; }
      #dollCardRed { bottom: 8px; left: 8px; }
      .doll-card .doll-wrap { width: 86px; height: 116px; }
      .doll-caption { font-size: 1.05rem; }
      .leaflet-bottom.leaflet-right { bottom: 165px; }
      .leaflet-bottom.leaflet-left { bottom: 140px; }
      .dialog { max-height: 94vh; padding: 22px; }
      .dialog .question { font-size: 2.32rem; }
      .dialog p, .dialog label, .feedback { font-size: 1.8rem !important; }
      .dialog input { font-size: 2.1rem; }
      .primary-button { font-size: 2rem; }
      #successContent { padding: 24px 18px; }
      #successText { font-size: 1.96rem; }
      #successText h3 { font-size: 2.7rem; }
    }
  </style>
</head>
<body>
  <!-- Plantilla común: el color del cuerpo identifica la zona -->

  <section id="welcome">
    <h1>JUEGO POR LA EDUCACIÓN PÚBLICA</h1>
    <p>Recorre las tres zonas, resuelve las preguntas y viste a los tres muñecos.</p>
    <div id="welcomeDolls">
      <div class="doll-wrap doll-purple" id="welcomePurple"></div>
      <div class="doll-wrap doll-orange" id="welcomeOrange"></div>
      <div class="doll-wrap doll-red" id="welcomeRed"></div>
    </div>
    <button id="startButton">Comenzar</button>
  </section>

  <main id="game">
    <div id="map" aria-label="Mapa interactivo de Rivas-Vaciamadrid"></div>
    <div class="map-header">
      <strong>JUEGO POR LA EDUCACIÓN PÚBLICA</strong>
      <div id="progress">Ubicaciones completadas: 0 de 22</div>
      <div id="gpsStatus">Selecciona un punto del mapa para comprobar tu ubicación.</div>
    </div>
    <aside class="doll-card" id="dollCardPurple">
      <div class="doll-wrap doll-purple" id="mapDollPurple"></div>
      <div class="doll-caption" id="captionPurple">Morado · 0/8</div>
    </aside>
    <aside class="doll-card" id="dollCardOrange">
      <div class="doll-wrap doll-orange" id="mapDollOrange"></div>
      <div class="doll-caption" id="captionOrange">Naranja · 0/8</div>
    </aside>
    <aside class="doll-card" id="dollCardRed">
      <div class="doll-wrap doll-red" id="mapDollRed"></div>
      <div class="doll-caption" id="captionRed">Rojo · 0/8</div>
    </aside>
  </main>

  <section id="questionOverlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="questionTitle">
    <div class="dialog">
      <h2 id="questionTitle">Pista</h2>
      <p id="questionText" class="question"></p>
      <p id="locationStatus" class="feedback" style="color:#53645a"></p>
      <form id="answerForm">
        <div id="answerEntry">
          <label for="answerInput">Escribe tu respuesta:</label>
          <input id="answerInput" type="text" autocomplete="off" required>
          <button class="primary-button" id="answerButton" type="submit">Comprobar respuesta</button>
        </div>
      </form>
      <button class="primary-button" id="labyrinthButton" type="button" style="display:none">Comprobar que he llegado al centro</button>
      <p id="answerFeedback" class="feedback" aria-live="polite"></p>
    </div>
  </section>

  <section id="successOverlay" class="overlay" role="dialog" aria-modal="true">
    <div id="successContent">
      <h1 id="successTitle">Correcto</h1>
      <div id="successText"></div>
      <button class="primary-button" id="continueButton">Continuar</button>
    </div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const RADIO_METROS = 15;
    const PRECISION_MAXIMA = 15;
    const STORAGE_KEY = "juegoEducacionPublicaRivas_v3";

    const lugares = [
      // ZONA MORADA
      { id:"picasso", zona:"purple", nombre:"Plaza Pablo Picasso", lat:40.364390, lng:-3.549775,
        pregunta:"¿Apellido del pintor da nombre a esta plaza y que pintó el Guernica?", respuestas:["picasso"] },
      { id:"reloj", zona:"purple", nombre:"Reloj de Sol Villacís", lat:40.361005, lng:-3.550990,
        pregunta:"¿Cuál es el primer número romano que aparece en este reloj de Sol (el más pequeño)?", respuestas:["vi"] },
      { id:"covibar", zona:"purple", nombre:"Centro Cívico Covibar", lat:40.365180, lng:-3.549676,
        pregunta:"¿Quién es el personaje del libro más famoso en castellano representado sobre un caballo en esta imagen?", respuestas:["don quijote","quijote","don quijote de la mancha"] },
      { id:"juventud", zona:"purple", nombre:"Casa de la Juventud", lat:40.363516, lng:-3.550564,
        pregunta:"¿A qué juego se juega en esta zona? Si no lo conoces, ¡pregunta cómo se juega y prueba una partida!", respuestas:["petanca"] },
      { id:"perros", zona:"purple", nombre:"Parque de perros", lat:40.361802, lng:-3.551757,
        pregunta:"Tengo cuatro patas, una cola para mover cuando estoy contento y contigo quiero jugar. ¿Quién soy?", respuestas:["perro"] },
      { id:"futbol", zona:"purple", nombre:"Pista de fútbol", lat:40.362849, lng:-3.550582,
        pregunta:"Corre lo más rápido que puedas y contesta: ¿cuántos segundos tardas en ir de un lado a otro de la pista de fútbol?", rango:[9,30] },
      { id:"monolito", zona:"purple", nombre:"Monolito", lat:40.361133, lng:-3.552259,
        pregunta:"¿Qué figura geométrica forman los escalones que dan al monolito (la gran piedra en vertical)?", respuestas:["circulo"] },
      { id:"escudo", zona:"purple", nombre:"Antiguo escudo de Rivas-Vaciamadrid", lat:40.360124, lng:-3.551897,
        pregunta:"Busca un escudo por la zona. Es el escudo antiguo de Rivas-Vaciamadrid. ¿Qué edificación aparece en él?", respuestas:["castillo"] },

      // ZONA NARANJA
      { id:"fotos-parque", zona:"orange", nombre:"Parque lineal · Fotografías", lat:40.366223, lng:-3.546749,

      { id:"avispa", zona:"orange", nombre:"Parque lineal · Imagen de insectos", lat:40.366703, lng:-3.547439,
        pregunta:"¿Cuál es el animal más pequeño de los que aparecen en la imagen?", respuestas:["avispa","abeja"] },
      { id:"bancos", zona:"orange", nombre:"Parque lineal · Bancos bajo techo", lat:40.361503, lng:-3.543919,
        pregunta:"¿Cuántos bancos existen bajo la parte techada? ¡Acércate a cada uno de ellos para contarlos!", respuestas:["10","diez"] },
      { id:"laberinto", zona:"orange", nombre:"Parque lineal · Centro del laberinto", lat:40.360197, lng:-3.544260,
        pregunta:"Debes llegar al centro del laberinto con el teléfono móvil para que lo reconozca.", especial:"laberinto", radioPregunta:15, radioCompletar:5 },
      { id:"caracol", zona:"orange", nombre:"Parque lineal · Mirador", lat:40.362029, lng:-3.544085,
        pregunta:"¿Cómo se llama al tipo de subida de escaleras de este mirador? Tiene el nombre de un baboso animal.", respuestas:["escaleras de caracol","caracol"] },
      { id:"toboganes", zona:"orange", nombre:"Parque lineal · Toboganes", lat:40.363116, lng:-3.543748,
        pregunta:"¿Cuántos toboganes eres capaz de contar cercanos a esta zona? Si no están mojados, ¡tírate por cada uno de ellos en menos de 2 minutos!", respuestas:["3","tres"] },
      { id:"puente", zona:"orange", nombre:"Parque lineal · Puente colgante", lat:40.363116, lng:-3.543748, displayLat:40.363196, displayLng:-3.543688,

      // ZONA ROJA
      { id:"calle-sol", zona:"red", nombre:"Calle del Sol", lat:40.358069, lng:-3.546793,
        pregunta:"Uno de los dioses más importantes del antiguo Egipto fue Ra, quien era el dios del … (Pista: Una calle cercana contiene la palabra que buscas)", respuestas:["sol"] },
      { id:"tenis", zona:"red", nombre:"Polideportivo Cerro del Telégrafo · Tenis", lat:40.357722, lng:-3.545507,

      { id:"atletismo", zona:"red", nombre:"Polideportivo Cerro del Telégrafo · Atletismo", lat:40.357948, lng:-3.543265,

      { id:"cartel-parking", zona:"red", nombre:"Polideportivo Cerro del Telégrafo · Parking", lat:40.356761, lng:-3.546138,

      { id:"muro-colores", zona:"red", nombre:"Polideportivo Cerro del Telégrafo · Muro de colores", lat:40.356285, lng:-3.546489,
        pregunta:"Los colores que se ven en el muro son: rosa, morado, azul oscuro, azul claro, amarillo, naranja y …", respuestas:["verde"] },
      { id:"patinaje", zona:"red", nombre:"Polideportivo Cerro del Telégrafo · Patinaje", lat:40.357169, lng:-3.545284,
        pregunta:"¿Cuántas pistas de patinaje existen en el interior de este edificio?", respuestas:["2","dos"] },
      { id:"punto-limpio", zona:"red", nombre:"Punto limpio", lat:40.355701, lng:-3.545232,
        pregunta:"Mira el cartel informativo donde aparece el horario del punto limpio. ¿Dónde se tiraría un juguete de plástico?", respuestas:["plasticos no envase","plastico no envase"] },

    ];

    const mensajes = [
      `<h3>¿Sabías que...?</h3>

      `<h3>¿Sabías que...?</h3>

       <p>Ansiedad, tristeza, problemas de autoestima, dificultades familiares... En los institutos, los orientadores son fundamentales para escuchar, detectar problemas a tiempo y ayudar a quienes lo necesitan.</p>

       <p>Porque la salud mental de nuestros hijos también merece atención.</p>

      `<h3>¿Sabías que...?</h3>

      `<h3>¿Y si todo esto también fuera por tus hijos?</h3>
       <p><strong>Menos alumnos por aula. Más profesores de apoyo. Más orientadores para cuidar la salud mental. Más recursos y mejores instalaciones. Sustituciones rápidas para que ningún alumno pierda semanas de clase.</strong></p>

    ];

    const nombresZonas = { purple:"Morado", orange:"Naranja", red:"Rojo" };
    const prendas = ["camiseta verde","pantalón vaquero","calcetines","gorro verde","zapatos","sudadera verde","guantes","bufanda verde"];
    const MAX_PRENDAS = prendas.length;

    function cargarEstado() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        return Array.isArray(data.completados) ? data.completados : [];
      } catch (_) { return []; }
    }
    let completados = new Set(cargarEstado());
    let mapa = null, marcadores = {}, lugarActivo = null, comprobando = false;
    let circuloJugador = null, seguimientoGPS = null, ultimaPosicion = null;

    function guardarEstado() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ completados:[...completados] }));
    }
    function normalizar(texto) {
      return texto.trim().toLocaleLowerCase("es").normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "").replace(/[¿?¡!.,;:…]/g, "").replace(/\s+/g, " ");
    }
    function distanciaMetros(lat1, lon1, lat2, lon2) {
      const R=6371000, rad=v=>v*Math.PI/180;
      const dLat=rad(lat2-lat1), dLon=rad(lon2-lon1);
      const a=Math.sin(dLat/2)**2 + Math.cos(rad(lat1))*Math.cos(rad(lat2))*Math.sin(dLon/2)**2;
      return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    }
    function crearMuneco(elemento, nivel) {
      elemento.innerHTML = document.getElementById("dollTemplate").innerHTML;
      const svg = elemento.querySelector("svg");
      svg.classList.add(`level-${Math.min(MAX_PRENDAS,nivel)}`);
    }
    function progresoZona(zona) {
      const total = lugares.filter(l => l.zona === zona).length;
      const hechas = lugares.filter(l => l.zona === zona && completados.has(l.id)).length;
      // En las zonas de siete preguntas, la última respuesta completa las ocho prendas.
      const nivel = hechas >= total && total === 7 ? MAX_PRENDAS : Math.min(MAX_PRENDAS, hechas);
      return {hechas,total,nivel};
    }
    function actualizarMunecos() {
      const zonas = [
        {key:"Purple", id:"purple", label:"Morado"},
        {key:"Orange", id:"orange", label:"Naranja"},
        {key:"Red", id:"red", label:"Rojo"}
      ];
      zonas.forEach(z => {
        const progreso = progresoZona(z.id);
        crearMuneco(document.getElementById("mapDoll"+z.key), progreso.nivel);
        crearMuneco(document.getElementById("welcome"+z.key), progreso.nivel);
        document.getElementById("caption"+z.key).textContent =
          `${z.label} · ${progreso.nivel}/8 prendas`;
      });
    }
    function actualizarProgreso() {
      document.getElementById("progress").textContent =
        `Ubicaciones completadas: ${completados.size} de ${lugares.length}`;
      actualizarMunecos();
    }
    function iconoMarcador(lugar, hecho) {
      const color = hecho ? "done" : lugar.zona;
      return L.divIcon({
        className:"",
        html:`<div class="zone-marker ${color}" aria-label="${hecho ? "Completado" : nombresZonas[lugar.zona]}"></div>`,
        iconSize:[30,30], iconAnchor:[15,15]
      });
    }
    function iniciarMapa() {
      if (mapa) { mapa.invalidateSize(); return; }
      mapa = L.map("map", {zoomControl:true});
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom:19, attribution:"&copy; OpenStreetMap"
      }).addTo(mapa);

      lugares.forEach(lugar => {
        const markerLat = lugar.displayLat ?? lugar.lat;
        const markerLng = lugar.displayLng ?? lugar.lng;
        const marker = L.marker([markerLat,markerLng], {
          icon:iconoMarcador(lugar,completados.has(lugar.id))
        }).addTo(mapa);
        marker.bindTooltip(lugar.nombre);
        marker.on("click",()=>iniciarComprobacion(lugar));
        marcadores[lugar.id] = marker;
      });
      const bounds = L.latLngBounds(lugares.map(l=>[l.lat,l.lng]));
      mapa.fitBounds(bounds,{padding:[65,65]});
      actualizarProgreso();
      iniciarSeguimientoGPS();
    }
    function actualizarEstadoGPS(texto) {
      document.getElementById("gpsStatus").textContent = texto;
    }
    function posicionValida(pos) {
      if (!pos) return {ok:false,texto:"No hemos podido comprobar tu ubicación."};
      if (pos.accuracy > PRECISION_MAXIMA) {
        return {ok:false,texto:`La precisión actual del GPS es de unos ${Math.round(pos.accuracy)} m. Necesitamos una precisión de ${PRECISION_MAXIMA} m o mejor. Prueba al aire libre y vuelve a intentarlo.`};
      }
      return {ok:true,texto:`Ubicación comprobada (precisión aproximada: ${Math.round(pos.accuracy)} m).`};
    }
    function evaluarPosicion(lugar,pos,radio) {
      const precision = posicionValida(pos);
      if (!precision.ok) return precision;
      const distancia = distanciaMetros(pos.lat,pos.lng,lugar.lat,lugar.lng);
      if (distancia > radio) {
        return {ok:false,texto:`Estás aproximadamente a ${Math.round(distancia)} m del punto. Acércate hasta estar a ${radio} m o menos.`};
      }
      return {ok:true,texto:`Estás a ${distancia.toFixed(1)} m del punto. ${precision.texto}`};
    }
    function leerPosicion(callback) {
      if (!navigator.geolocation) {
        actualizarEstadoGPS("Tu navegador no permite usar la geolocalización.");
        callback(null); return;
      }
      navigator.geolocation.getCurrentPosition(
        pos=>callback({lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy}),
        err=>{
          let msg="No se pudo obtener tu ubicación.";
          if(err.code===1) msg="Has bloqueado el acceso a la ubicación. Actívalo en el navegador.";
          if(err.code===2) msg="No se ha podido determinar tu ubicación. Comprueba el GPS.";
          if(err.code===3) msg="El GPS ha tardado demasiado. Vuelve a intentarlo.";
          actualizarEstadoGPS(msg); callback(null);
        },
        {enableHighAccuracy:true,maximumAge:0,timeout:20000}
      );
    }
    function iniciarSeguimientoGPS() {
      if (!navigator.geolocation || seguimientoGPS !== null) return;
      seguimientoGPS = navigator.geolocation.watchPosition(pos=>{
        const p={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy};
        ultimaPosicion=p;
        if (!mapa) return;
        if (!circuloJugador) {
          circuloJugador=L.circleMarker([p.lat,p.lng],{
            radius:13, color:"#0754b8", weight:2,
            fillColor:"#0878ff", fillOpacity:0.5
          }).addTo(mapa);
        } else circuloJugador.setLatLng([p.lat,p.lng]);
      },err=>{
        if(err.code===1) actualizarEstadoGPS("Activa el permiso de ubicación para ver tu posición en el mapa.");
      },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
    }

    function iniciarComprobacion(lugar) {
      if(completados.has(lugar.id)) {
        actualizarEstadoGPS("Este punto ya está completado. ¡Busca otro!");
        return;
      }
      if(comprobando) return;
      comprobando=true; lugarActivo=lugar;
      actualizarEstadoGPS(`Comprobando si estás cerca de ${lugar.nombre}…`);
      leerPosicion(pos=>{
        comprobando=false;
        if(!pos) return;
        ultimaPosicion=pos;
        const radio=lugar.radioPregunta ?? RADIO_METROS;
        const resultado=evaluarPosicion(lugar,pos,radio);
        actualizarEstadoGPS(resultado.texto);
        if(resultado.ok) abrirPregunta(lugar,resultado.texto);
      });
    }
    function abrirPregunta(lugar,estado) {
      lugarActivo=lugar;
      document.getElementById("questionTitle").textContent=lugar.nombre;
      document.getElementById("questionText").textContent=lugar.pregunta;
      document.getElementById("locationStatus").textContent=estado;
      document.getElementById("answerInput").value="";
      document.getElementById("answerFeedback").textContent="";
      const esLaberinto=lugar.especial==="laberinto";
      document.getElementById("answerEntry").style.display=esLaberinto?"none":"block";
      document.getElementById("labyrinthButton").style.display=esLaberinto?"inline-block":"none";
      document.getElementById("questionOverlay").style.display="flex";
      if(!esLaberinto) setTimeout(()=>document.getElementById("answerInput").focus(),100);
    }
    function completarLugar(lugar) {
      completados.add(lugar.id);
      guardarEstado();
      marcadores[lugar.id].setIcon(iconoMarcador(lugar,true));
      actualizarProgreso();
      document.getElementById("questionOverlay").style.display="none";
      const progreso = progresoZona(lugar.zona);
      mostrarMensaje(lugar.zona, progreso.hechas, progreso.total);
    }
    document.getElementById("answerForm").addEventListener("submit",event=>{
      event.preventDefault();
      if(!lugarActivo || comprobando || lugarActivo.especial==="laberinto") return;
      const boton=document.getElementById("answerButton");
      boton.disabled=true;
      document.getElementById("answerFeedback").textContent="Volviendo a comprobar tu ubicación…";
      comprobando=true;
      const lugar=lugarActivo;
      leerPosicion(pos=>{
        comprobando=false; boton.disabled=false;
        if(!pos) {
          document.getElementById("answerFeedback").textContent="No hemos podido verificar que sigas en el lugar. Vuelve a intentarlo.";
          return;
        }
        ultimaPosicion=pos;
        const resultado=evaluarPosicion(lugar,pos,RADIO_METROS);
        if(!resultado.ok) {
          document.getElementById("answerFeedback").textContent=resultado.texto; return;
        }
        const texto=document.getElementById("answerInput").value;
        let correcta=false;
        if(lugar.rango) {
          const n=Number(normalizar(texto).replace(",","."));
          correcta=Number.isFinite(n) && n>=lugar.rango[0] && n<=lugar.rango[1];
        } else {
          correcta=lugar.respuestas.map(normalizar).includes(normalizar(texto));
        }
        if(!correcta) {
          document.getElementById("answerFeedback").textContent="La respuesta no es correcta. ¡Vuelve a mirar a tu alrededor e inténtalo!";
          return;
        }
        completarLugar(lugar);
      });
    });
    document.getElementById("labyrinthButton").addEventListener("click",()=>{
      if(!lugarActivo || comprobando) return;
      const boton=document.getElementById("labyrinthButton");
      boton.disabled=true;
      document.getElementById("answerFeedback").textContent="Comprobando si has llegado al centro…";
      comprobando=true;
      const lugar=lugarActivo;
      leerPosicion(pos=>{
        comprobando=false; boton.disabled=false;
        if(!pos) {
          document.getElementById("answerFeedback").textContent="No hemos podido verificar tu ubicación. Vuelve a intentarlo.";
          return;
        }
        ultimaPosicion=pos;
        const resultado=evaluarPosicion(lugar,pos,lugar.radioCompletar);
        document.getElementById("locationStatus").textContent=resultado.texto;
        if(!resultado.ok) {
          document.getElementById("answerFeedback").textContent=resultado.texto;
          return;
        }
        completarLugar(lugar);
      });
    });

    function mostrarPantalla(tituloTexto, contenido) {
      document.getElementById("successTitle").textContent=tituloTexto;
      document.getElementById("successText").innerHTML=contenido;
      document.getElementById("successOverlay").style.display="flex";
      document.getElementById("successOverlay").scrollTop=0;
      document.getElementById("successContent").scrollTop=0;
    }
    function mostrarMensaje(zona, aciertosZona, totalZona) {
      // Las zonas de ocho puntos muestran los mensajes 1-8.
      // Las zonas de siete puntos muestran 1-6 y después directamente el mensaje final (8).
      const numeroMensaje = (totalZona === 7 && aciertosZona === 7) ? 8 : aciertosZona;
      const esFinal = numeroMensaje === 8;
      mostrarPantalla(esFinal ? "ENHORABUENA" : "Correcto", mensajes[numeroMensaje-1]);
    }
    document.getElementById("continueButton").addEventListener("click",()=>{
      document.getElementById("successOverlay").style.display="none";
      lugarActivo=null;
      actualizarEstadoGPS("Selecciona otro punto del mapa para continuar.");
      if(mapa) setTimeout(()=>mapa.invalidateSize(),100);
    });
    document.getElementById("startButton").addEventListener("click",()=>{
      document.getElementById("welcome").style.display="none";
      document.getElementById("game").style.display="block";
      iniciarMapa();
      setTimeout(()=>mapa.invalidateSize(),100);
    });

    actualizarMunecos();
  </script>
